# =============================================================================
# 全国统一政策参数（与城市无关的部分）
# 二次开发自开源底座 ikiwihome/income-calc (MIT)，并按交付场景扩展
# 所有标准均以「元 / 月」为单位，除非显式标注 annual
# =============================================================================
meta:
  name: 全国统一薪税政策参数
  version: 2026.1
  updated_on: "2026-10-08"
  base_project: "ikiwihome/income-calc (MIT License)"

# ---------------------------------------------------------------------------
# 基本减除费用（起征点）
# ---------------------------------------------------------------------------
basic_deduction:
  monthly: 5000        # 5000 元/月
  annual: 60000        # 60000 元/年

# ---------------------------------------------------------------------------
# 综合所得年度税率表（累计预扣法与年度汇算共用）
# 应纳税所得额 = 累计收入 - 累计基本减除 - 累计专项扣除(五险一金)
#                - 累计专项附加扣除 - 累计其他扣除
# 应纳税额 = 应纳税所得额 × 税率 - 速算扣除数
# ---------------------------------------------------------------------------
tax_brackets:
  - { upper: 36000,     rate: 0.03, quick_deduction: 0 }
  - { upper: 144000,    rate: 0.10, quick_deduction: 2520 }
  - { upper: 300000,    rate: 0.20, quick_deduction: 16920 }
  - { upper: 420000,    rate: 0.25, quick_deduction: 31920 }
  - { upper: 660000,    rate: 0.30, quick_deduction: 52920 }
  - { upper: 960000,    rate: 0.35, quick_deduction: 85920 }
  - { upper: null,      rate: 0.45, quick_deduction: 181920 }   # null 表示无上限

# ---------------------------------------------------------------------------
# 全年一次性奖金「单独计税」按月换算税率表
# 以「奖金总额 ÷ 12」查表，税额 = 奖金总额 × 税率 - 速算扣除数
# 政策依据：财政部 税务总局公告 2023 年第 30 号，延续至 2027-12-31
# ---------------------------------------------------------------------------
annual_bonus_brackets:
  - { upper: 3000,   rate: 0.03, quick_deduction: 0 }
  - { upper: 12000,  rate: 0.10, quick_deduction: 210 }
  - { upper: 25000,  rate: 0.20, quick_deduction: 1410 }
  - { upper: 35000,  rate: 0.25, quick_deduction: 2660 }
  - { upper: 55000,  rate: 0.30, quick_deduction: 4410 }
  - { upper: 80000,  rate: 0.35, quick_deduction: 7160 }
  - { upper: null,   rate: 0.45, quick_deduction: 15160 }

annual_bonus_policy:
  separate_tax_valid_until: "2027-12-31"   # 单独计税政策有效期
  auto_optimize: true                       # 是否自动在「单独计税 / 并入综合所得」间择优

# ---------------------------------------------------------------------------
# 专项附加扣除国家标准（2023-08-31 国务院提高后的标准，沿用至今）
# monthly_cap 为每人每月扣除上限，校验模块据此判断超标
# ---------------------------------------------------------------------------
special_deductions:
  children:        { label: "子女教育",       monthly_cap: 2000, unit: "每名子女",   note: "满3岁至全日制学历教育结束" }
  infant:          { label: "3岁以下婴幼儿照护", monthly_cap: 2000, unit: "每名婴幼儿", note: "婴幼儿出生当月至年满3周岁前一个月" }
  education:       { label: "继续教育",       monthly_cap: 400,  unit: "人",         note: "学历继续教育400元/月，最长48个月；职业资格教育3600元/年定额" }
  mortgage:        { label: "住房贷款利息",   monthly_cap: 1000, unit: "人",         note: "首套住房贷款，最长240个月" }
  rent:            { label: "住房租金",       monthly_cap: null, unit: "人",         note: "按城市分档：直辖市/省会/计划单列市1500，市辖区户籍人口>100万的城市1100，≤100万的城市800", by_city: true }
  elderly:         { label: "赡养老人",       monthly_cap: 3000, unit: "人",         note: "被赡养人年满60岁；独生子女3000元/月，非独生子女分摊每人不超过1500元/月" }

# 大病医疗：仅在年度汇算时扣除，不进月度预扣
medical_deduction:
  threshold: 15000     # 个人负担累计超过 15000 元的部分方可扣除
  annual_cap: 80000    # 年度限额 80000 元
  monthly_prepay: false

# ---------------------------------------------------------------------------
# 闪电校验：默认阈值（可在 config 中按客户覆盖）
# ---------------------------------------------------------------------------
validation:
  amount_tolerance: 0.02        # 金额比对容差（元），用于个税反算 / 差异比对
  ratio_tolerance: 0.0005       # 比例容差
  month_over_month_alert: 0.5   # 月度收入或个税环比波动超过 50% 触发提示
  diff_error_threshold: 100      # 与客户结果的差异超过 100 元判为「错误」，否则仅「警告」
  housing_rate_range: [5, 12]   # 住房公积金缴存比例合法区间（%）
  require_id_card: false        # 是否强制要求证件号
